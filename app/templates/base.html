<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Bons{% endblock %} · Kassenbons</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bons">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  {% if request.session.get("user") %}
  <nav class="topnav">
    <a href="/" class="{% if active == 'upload' %}active{% endif %}">Hochladen</a>
    <a href="/bons" class="{% if active == 'bons' %}active{% endif %}">Bons</a>
    <form method="post" action="/logout" class="logout"><button type="submit" title="Abmelden">⎋</button></form>
  </nav>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
